blueprint:
  name: Is It Dead? Actionable Alerts
  description: Send actionable notifications to your mobile device when sensors go silent. Includes a reversible 24-hour snooze. Reports low batteries and persistent weak signals too.
  domain: automation
  input:
    alert_sensor:
      name: Aggregate Alert Sensor
      description: The aggregate binary sensor entity that monitors dead states.
      default: binary_sensor.is_it_dead_alert
      selector:
        entity:
          domain: binary_sensor
          integration: is_it_dead
    notify_device:
      name: Device to notify
      description: The mobile device to receive actionable notifications.
      selector:
        device:
          integration: mobile_app
    title:
      name: Notification Title
      description: Title of the mobile alert.
      default: "Capteurs à vérifier"
    message:
      name: Notification Message
      description: Message body (supports template parsing).
      default: "Hors ligne probables : {{ state_attr(alert_sensor, 'dead_devices') or [] }}. Piles faibles : {{ state_attr(alert_sensor, 'low_battery_devices') or [] }}. Signal faible : {{ state_attr(alert_sensor, 'weak_signal_devices') or [] }}."

mode: single

trigger:
  - platform: state
    entity_id: !input alert_sensor
    attribute: alert_device_ids
    id: alert_triggered
  - platform: event
    event_type: mobile_app_notification_action
    id: snooze_clicked

action:
  - variables:
      alert_sensor: !input alert_sensor
      notify_device: !input notify_device
  - choose:
      - conditions:
          - condition: trigger
            id: alert_triggered
          - condition: template
            value_template: "{{ (state_attr(alert_sensor, 'alert_device_ids') or []) | count > 0 }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: !input title
            message: !input message
            data:
              url: /is_it_dead
              tag: "{{ this.entity_id }}"
              actions:
                - action: "{{ 'IS_IT_DEAD_SNOOZE_' ~ this.entity_id }}"
                  title: "Snooze 24h"

      - conditions:
          - condition: trigger
            id: snooze_clicked
          - condition: template
            value_template: "{{ trigger.event.data.action == 'IS_IT_DEAD_SNOOZE_' ~ this.entity_id }}"
        sequence:
          - repeat:
              for_each: "{{ state_attr(alert_sensor, 'alert_device_ids') or [] }}"
              sequence:
                - service: is_it_dead.snooze_device
                  data:
                    device_id: "{{ repeat.item }}"
                    duration_hours: 24

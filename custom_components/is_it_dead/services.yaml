exclude_entity:
  name: Exclude Entity
  description: Permanently exclude a monitored entity from Is It Dead? surveillance. The entity will be added to the exclusion list in the integration options.
  fields:
    entity_id:
      name: Entity ID
      description: The entity to exclude from monitoring.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        entity:

snooze_entity:
  name: Snooze Entity
  description: Temporarily suppress dead alerts for a monitored entity. The entity will still be tracked but will not trigger alerts until the snooze period expires.
  fields:
    entity_id:
      name: Entity ID
      description: The entity to snooze alerts for.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        entity:
    duration_hours:
      name: Duration (Hours)
      description: How long to snooze alerts. Set to 0 to unsnooze immediately.
      required: false
      default: 24
      example: 24
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: hours

relearn_entity:
  name: Re-learn Entity
  description: Reset the learned check-in interval history for an entity. The integration will re-learn its reporting pattern from scratch.
  fields:
    entity_id:
      name: Entity ID
      description: The entity to reset learning history for.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        entity:

set_manual_timeout:
  name: Set Manual Timeout
  description: Override the learned timeout threshold with a manual value. Set to 0 to remove the override and revert to the learned average.
  fields:
    entity_id:
      name: Entity ID
      description: The entity to set a manual timeout for.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        entity:
    timeout_hours:
      name: Timeout (Hours)
      description: The manual timeout threshold in hours. Set to 0 to clear the override.
      required: true
      example: 12
      selector:
        number:
          min: 0
          max: 720
          step: 0.5
          unit_of_measurement: hours

check_device:
  name: Check Zigbee device
  description: Bounded read-only radio diagnostic. No response is inconclusive for sleeping devices. Five-minute cooldown.
  fields:
    device_id:
      required: true
      selector:
        device:

test_preview:
  name: Preview guided test
  description: List monitored devices and automation references. Does not change any automation. Admin only.
  fields:
    device_ids:
      selector:
        device:
          multiple: true
start_test:
  name: Start guided test
  description: Suspend the explicitly selected automations for at most 120 minutes. Recovery is persisted. Admin only.
  fields:
    device_ids:
      required: true
      selector:
        device:
          multiple: true
    automation_ids:
      required: true
      selector:
        entity:
          domain: automation
          multiple: true
    minutes:
      default: 30
      selector:
        number:
          min: 1
          max: 120
end_test:
  name: End guided test
  description: Restore only automations that were on before this test. Admin only.
test_status:
  name: Guided test status
  description: Read test evidence and outstanding restoration. Admin only.
confirm_test:
  name: Confirm manual functional check
  description: Record an explicit human check, separately from radio evidence. Admin only.
  fields:
    device_id:
      required: true
      selector:
        device:
